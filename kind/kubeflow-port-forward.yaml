apiVersion: v1
kind: Namespace
metadata:
  name: kubeflow
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: port-forward-helper
  namespace: kubeflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: port-forward-helper
  template:
    metadata:
      labels:
        app: port-forward-helper
    spec:
      containers:
        - name: helper
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
